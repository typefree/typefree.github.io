<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=/apps/amenige/">
  <meta name="theme-color" content="#075fa8">
  <title>アメニゲ | TypeFree</title>
  <link rel="icon" href="/assets/amenige-icon.png">
  <script>
    (() => {
      const destination = new URL('/apps/amenige/', window.location.origin);
      const current = new URL(window.location.href);
      if (current.searchParams.get('lang') === 'en') destination.searchParams.set('lang', 'en');
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p><a href="/apps/amenige/">アメニゲの紹介ページへ</a></p>
</body>
</html>
